name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quality gate: run on every push and on PRs into main so regressions are caught
# BEFORE they reach production (main auto-deploys to Railway). This is the
# safety net that replaces "users are the QA environment".
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Tripwire for committed credentials. backend/.env was once committed with
      # a live API key in it; this makes the next one fail before it merges.
      - name: Scan tracked files for secrets
        run: node scripts/scan-secrets.mjs

  unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Backend syntax check
        run: npm run check:backend
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run

  e2e:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Install the browser here (the repo does not vendor it). The Playwright
      # config falls back to Playwright's own browser resolution when the
      # sandbox path /opt/pw-browsers is absent, so this Just Works on CI.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
