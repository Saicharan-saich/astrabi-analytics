    <style>
      body {
        background-color: #080b14;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
  <!-- The dev importmap (react/lucide/recharts/etc. via esm.sh) was removed:

       React versions) to the production HTML. -->
<link rel="stylesheet" href="/index.css">
