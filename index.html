    <script>
      // Guard the config: if the Tailwind CDN fails to load (blocked network,
      // offline, slow), `tailwind` is undefined — assigning to it would throw an
      // uncaught error and take the whole app down. Degrade gracefully instead.
      if (window.tailwind) {
        window.tailwind.config = {
          theme: {
            extend: {
              colors: {
                brand: {
                  50: '#f0fdfa',
                  100: '#ccfbf1',
                  500: '#14b8a6',
                  600: '#0d9488',
                  900: '#134e4a',
                },
                slate: {
                  850: '#1e293b', // Custom dark
                }
              }
            }
          }
        };
      }
    </script>
    <style>
      body {

      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {

      }
    </style>
