<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QuickInsight — AI-powered business intelligence. Upload your data, ask questions, and get instant visualizations and insights." />
    <meta name="theme-color" content="#0a0c12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="QuickInsight" />
    <meta property="og:description" content="AI-powered business intelligence platform. Upload data, ask questions, get insights." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QuickInsight — Business Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind is compiled into index.css at build time (see tailwind.config.js).
         The runtime cdn.tailwindcss.com script was removed — no production
         dependency on an external CDN for styling. -->

    <style>
      /* Paint the app ground before the stylesheet loads (no white flash).
         Scrollbars are styled theme-aware in index.css. */
      body {
        background-color: #0a0c12;
      }
    </style>
  <!-- The dev importmap (react/lucide/recharts/etc. via esm.sh) was removed:
       Vite bundles all dependencies from package.json at build time, so the map
       was dead cruft that only added external-CDN references (and conflicting
       React versions) to the production HTML. -->
<link rel="stylesheet" href="/index.css">
</head>

    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>

</body>
</html>
